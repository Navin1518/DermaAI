function computeQuiz(){
  const a=app.quizAnswers,points={normal:0,oily:0,dry:0,combination:0,sensitive:0};
  if(a.type&&points[a.type]!==undefined)points[a.type]+=3;
  if(a.oil==='high')points.oily+=2;if(a.oil==='low')points.dry+=2;if(a.oil==='some')points.combination+=1;
  if(a.wash==='tight')points.dry+=2;if(a.wash==='oily')points.oily+=2;if(a.wash==='comfortable')points.normal+=1;
  if(a.sensitive==='sensitive'||a.sensitive==='allergy')points.sensitive+=4;
  if(a.type==='combination')points.combination+=1;
  let ordered=Object.entries(points).sort((x,y)=>y[1]-x[1]);
  const skin=ordered[0][1]===0?'normal':ordered[0][0];
  const concerns=[];
  if(a.concern)concerns.push(a.concern);
  if(a.acne==='often'||a.acne==='mild')concerns.push('Muhase aur dane');
  if(a.pigment==='yes'||a.pigment==='some')concerns.push('Tan ya kaala-pan');
  if(!concerns.length)concerns.push('Roz ki dekhbhaal');
  if(new Set(concerns).size<2)concerns.push(concerns[0]==='Roz ki dekhbhaal'?'Skin balance':'Roz ki dekhbhaal');
  const labels={normal:['Normal','Normal'],oily:['Oily','Oily'],dry:['Dry','Dry'],combination:['Combination','Combination'],sensitive:['Sensitive','Sensitive']};
  return {skinType:labels[skin][0],skinTypeEn:labels[skin][1],skinTypeHi:SKIN_HI[skin],concerns:[...new Set(concerns)].slice(0,2),answers:{...a},allergy:a.sensitive==='allergy',skinKey:skin};
}

function analyzeImage(){
  if(!app.photo)return;
  const image=new Image();image.onload=()=>{
    const canvas=document.createElement('canvas'),size=160;canvas.width=size;canvas.height=size;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx){showToast(app.lang==='hi'?'फ़ोटो प्रोसेस नहीं हो सकी।':'The photo could not be processed.');return;}
    const scale=Math.min(size/image.naturalWidth,size/image.naturalHeight),w=image.naturalWidth*scale,h=image.naturalHeight*scale;
    ctx.drawImage(image,(size-w)/2,(size-h)/2,w,h);
    const data=ctx.getImageData(40,40,80,80).data;let lum=0,red=0,shine=0,low=255,high=0,valid=0;
    for(let i=0;i<data.length;i+=4){const r=data[i],g=data[i+1],b=data[i+2],l=.2126*r+.7152*g+.0722*b;lum+=l;red+=Math.max(0,r-(g+b)/2);shine+=l>210?1:0;low=Math.min(low,l);high=Math.max(high,l);valid++;}
    const brightness=Math.round(lum/valid/255*100),redness=Math.round(Math.min(100,red/valid/80*100)),oil=Math.round(shine/valid*100),unevenness=Math.round(Math.min(100,(high-low)/2.55));
    app.photoScores={brightness,redness,oil,unevenness};renderPhoto();
  };
  image.onerror=()=>showToast(app.lang==='hi'?'यह फ़ोटो पढ़ी नहीं जा सकी।':'This photo could not be read.');
  image.src=app.photo.url;
}

function buildPlan(quiz,photo){
  if(!quiz)return null;
  const avoidRisk=quiz.skinKey==='sensitive'||quiz.allergy;
  const scored=REMEDIES.map(remedy=>{
    if(quiz.allergy||(avoidRisk&&(!remedy.tags.includes('soothing')||remedy.tags.includes('sensitive-risk'))))return {...remedy,score:-100};
    let score=1;const c=quiz.concerns.join(' ').toLowerCase(),tags=remedy.tags,reasons=[];
    if((quiz.skinKey==='oily'||quiz.skinKey==='combination')&&tags.includes('oily')){score+=3;reasons.push('oil');}
    if(quiz.skinKey==='dry'&&tags.includes('dry')){score+=3;reasons.push('dry');}
    if(quiz.skinKey==='sensitive'&&tags.includes('soothing')){score+=2;reasons.push('soothing');}
    if(quiz.skinKey==='normal'&&tags.includes('soothing')){score+=1;reasons.push('normal');}
    if(c.includes('muhase')&&tags.includes('acne')){score+=4;reasons.push('acne');}
    if(c.includes('pheeka')&&tags.includes('glow')){score+=2;reasons.push('dull');}
    if((c.includes('tan')||c.includes('kaala'))&&tags.includes('uneven')){score+=2;reasons.push('tone');}
    if(c.includes('baal')&&(tags.includes('hair')||tags.includes('scalp'))){score+=5;reasons.push('hair');}
    if(photo&&photo.oil>65&&tags.includes('oily')){score+=2;reasons.push('photo-shine');}
    if(photo&&photo.redness>65&&tags.includes('soothing')){score+=1;reasons.push('photo-redness');}
    if(photo&&photo.unevenness>60&&(tags.includes('uneven')||tags.includes('glow'))){score+=1;reasons.push('photo-tone');}
    if(photo&&photo.brightness<35&&tags.includes('glow')){score+=1;reasons.push('photo-light');}
    if(remedy.id==='coffee-sugar'||remedy.id==='tomato-pack'||remedy.id==='potato-juice')score-=4;
    if(!reasons.length)reasons.push('general');
    return {...remedy,score,reasons};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score);
  const chosen=[];for(const r of scored){if(!chosen.some(x=>x.cat===r.cat)||chosen.length<3){chosen.push(r);}if(chosen.length===6)break;}
  return {quiz,photo,remedies:chosen,date:new Date().toLocaleDateString(app.lang==='hi'?'en-GB':'en-US'),createdAt:new Date().toISOString()};
}

function reasonText(remedy,lang){
  const reasons=remedy.reasons||[];
  const label={en:{hair:'You mentioned a hair or scalp concern.',acne:'You mentioned acne or spots.',dull:'You mentioned dull-looking skin.',tone:'You mentioned uneven tone or dark marks.',oil:'Your answers indicate that excess oil is a concern.',dry:'Your answers indicate that dryness is a concern.',soothing:'You reported sensitive skin, so gentler options were prioritised.',photo:'The photo estimate showed shine; this is not a diagnosis.','photo-redness':'The photo estimate showed visible redness; a soothing option was prioritised. This is not a diagnosis.','photo-tone':'The photo estimate showed uneven brightness; this is not a diagnosis.','photo-light':'The photo estimate showed low brightness; this is not a diagnosis.',general:'Included as a general home-care idea; it is not a treatment recommendation.',normal:'This is a general option based on your quiz.',oily:'This matches your oil-related answers.',combination:'This is a general option for combination skin.',sensitive:'Gentler options were prioritised for sensitive skin.'},hi:{hair:'आपने बालों या सिर की त्वचा से जुड़ी चिंता बताई।',acne:'आपने मुहाँसों या दानों की चिंता बताई।',dull:'आपने बेजान दिखने वाली त्वचा की चिंता बताई।',tone:'आपने असमान रंगत या काले दाग़ की चिंता बताई।',oil:'आपके जवाबों में अतिरिक्त तेल की चिंता सामने आई।',dry:'आपके जवाबों में रूखी त्वचा की चिंता सामने आई।',soothing:'आपने संवेदनशील त्वचा बताई, इसलिए अपेक्षाकृत सौम्य विकल्पों को प्राथमिकता दी गई।',photo:'तस्वीर के अनुमान में चमक अधिक दिखी; यह चिकित्सीय निदान नहीं है।','photo-redness':'तस्वीर के अनुमान में लालिमा दिखी; इसलिए आराम देने वाले विकल्प को प्राथमिकता दी गई। यह निदान नहीं है।','photo-tone':'तस्वीर के अनुमान में रंगत असमान दिखी; यह चिकित्सीय निदान नहीं है।','photo-light':'तस्वीर के अनुमान में प्रकाश कम दिखा; यह चिकित्सीय निदान नहीं है।',general:'यह सामान्य घरेलू देखभाल का विचार है, उपचार की सलाह नहीं।',normal:'यह आपकी प्रश्नावली के आधार पर एक सामान्य सुझाव है।',oily:'यह सुझाव तेल से जुड़े आपके जवाबों के अनुसार है।',combination:'यह मिश्रित त्वचा के लिए एक सामान्य विकल्प है।',sensitive:'संवेदनशील त्वचा के लिए सौम्य विकल्पों को प्राथमिकता दी गई।'}}[lang];
  return (reasons.length?reasons:[remedy.reasons&&remedy.reasons[0]]).map(key=>label[key]||label.normal).join(' ');
}
function renderPlan(){
  const host=$('#view-plan');
  if(!app.plan){host.innerHTML=`${pageHead(t('planTitle'),t('planEmptyText'))}<div class="card empty-state"><div class="em">🌱</div><h2>${esc(t('planEmpty'))}</h2><p class="muted">${esc(t('planEmptyText'))}</p><div class="actions" style="justify-content:center"><button class="btn btn-primary" data-view-link="quiz">${esc(t('startQuiz'))}</button></div></div><div class="notice">${esc(t('patchWarn'))} ${esc(t('disclaimerShort'))}</div>`;return;}
  const p=app.plan,eng=app.planLang==='en',skin=eng?p.quiz.skinTypeEn:p.quiz.skinTypeHi;
  host.innerHTML=`${pageHead(t('planTitle'),t('planIntro'))}<div class="toolbar"><button class="btn btn-light" data-action="plan-language">${esc(t('planLanguage'))}</button><button class="btn btn-light" data-action="plan-copy">${esc(t('copy'))}</button><button class="btn btn-light" data-action="plan-whatsapp">${esc(t('whatsapp'))}</button><button class="btn btn-primary" data-action="plan-print">${esc(t('print'))}</button></div><article class="card prescription" id="printPlan"><header class="prescription-head"><div class="eyebrow">HerbalGhar</div><h2>${eng?'Personal Skin & Hair Care Plan':'आपकी व्यक्तिगत त्वचा और बालों की देखभाल योजना'}</h2><p>${esc(tFor(app.planLang,'skinType'))}: <b>${esc(skin)}</b> · ${esc(tFor(app.planLang,'concerns'))}: ${esc(localizedConcerns(p.quiz.concerns,eng))}</p><p class="small muted">${esc(tFor(app.planLang,'dateLabel'))}: ${esc(p.date)}</p></header><section style="padding:18px 0"><div class="notice">${esc(tFor(app.planLang,'planBasis'))}</div><h2>${esc(tFor(app.planLang,'essentials'))}</h2>${p.remedies.length?p.remedies.map(r=>{const d=REMEDY_COPY[r.id][app.planLang];return `<div class="plan-remedy"><h3>${r.em} ${esc(d.name)}</h3><p><b>${esc(tFor(app.planLang,'reason'))}:</b> ${esc(reasonText(r,app.planLang))}</p><p><b>${esc(tFor(app.planLang,'ingredientsLabel'))}:</b> ${d.ing.map(esc).join(', ')}</p><p><b>${esc(tFor(app.planLang,'stepsLabel'))}:</b> ${d.steps.map(esc).join(' ')}</p><p><b>${esc(tFor(app.planLang,'freqLabel'))}:</b> ${esc(d.freq)}</p><p><b>${esc(tFor(app.planLang,'cautionLabel'))}:</b> ${esc(d.caution)}</p></div>`;}).join(''):`<p class="notice">${esc(tFor(app.planLang,'noRemediesForAllergy'))}</p>`}<div class="plan-remedy"><h3>${esc(tFor(app.planLang,'weeklyPlan'))}</h3><p>${esc(tFor(app.planLang,'gentlePlan'))}</p></div><div class="plan-remedy"><h3>${esc(tFor(app.planLang,'dailyHabits'))}</h3><p>${esc(tFor(app.planLang,'dailyText'))}</p></div><div class="plan-remedy"><h3>${esc(tFor(app.planLang,'personalizedHabits'))}</h3><ul>${personalHabits(p.quiz,app.planLang).map(note=>`<li>${esc(note)}</li>`).join('')}</ul></div><div class="plan-remedy"><h3>${esc(tFor(app.planLang,'avoid'))}</h3><p>${esc(tFor(app.planLang,'avoidText'))}</p></div><div class="notice"><b>${esc(tFor(app.planLang,'patchWarn'))}</b><br>${esc(tFor(app.planLang,'generalNotDiagnosis'))} ${esc(tFor(app.planLang,'disclaimerShort'))}</div></section></article><section class="card chat-card" aria-labelledby="chatTitle"><div class="chat-header"><div class="chat-avatar" aria-hidden="true">✦</div><div><h2 id="chatTitle">${esc(t('chatTitle'))}</h2><p class="muted small">${esc(t('chatSubtitle'))}</p></div><span class="tag green">${esc(t('chatPreview'))}</span></div><div class="chat-message"><strong>HerbalGhar</strong><p>${esc(t('chatSoon'))}</p></div><div class="chat-suggestions"><button type="button" data-action="chat-question">${esc(t('chatSuggested1'))}</button><button type="button" data-action="chat-question">${esc(t('chatSuggested2'))}</button><button type="button" data-action="chat-question">${esc(t('chatSuggested3'))}</button></div><div class="chat-compose"><input type="text" disabled aria-label="${esc(t('chatPlaceholder'))}" placeholder="${esc(t('chatPlaceholder'))}"><button type="button" class="btn btn-primary" disabled>${esc(t('chatSend'))}</button></div></section>`;
}
function renderView(view){
  if(view==='quiz')renderHomeQuiz();else if(view==='photo')renderPhoto();else if(view==='plan')renderPlan();else if(view==='remedies')renderRemedies();else if(view==='routine')renderRoutine();else if(view==='ingredients')renderIngredients();else if(view==='eco')renderEco();else renderSafety();
}
function showToast(message){const host=$('#toastHost');host.innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;setTimeout(()=>{host.innerHTML='';},2600);}
document.addEventListener('click',async e=>{
  const view=e.target.closest('[data-view]');if(view){openView(view.dataset.view);return;}
  const viewLink=e.target.closest('[data-view-link]');if(viewLink){openView(viewLink.dataset.viewLink);return;}
  const answer=e.target.closest('[data-answer]');if(answer){const q=QUESTIONS[app.quizIndex-1];app.quizAnswers[q.key]=answer.dataset.answer;renderQuizQuestion();return;}
  const remedy=e.target.closest('[data-remedy]');if(remedy){openRemedy(remedy.dataset.remedy);return;}
  const category=e.target.closest('[data-category]');if(category){app.category=category.dataset.category;renderRemedies();return;}
  const action=e.target.closest('[data-action]');if(!action)return;
  switch(action.dataset.action){
    case 'quiz-start':app.quizIndex=0;app.quizAnswers={};app.plan=null;renderQuizQuestion();break;
    case 'choose-language':app.lang=action.dataset.language;app.planLang=app.lang;app.quizIndex=app.quizIndex===0?1:app.quizIndex;saveState();renderShell();if(app.quizIndex===1&&app.view==='quiz')renderQuizQuestion();else renderView(app.view);break;
    case 'quiz-restart':app.quiz=null;app.plan=null;app.quizAnswers={};app.quizIndex=0;saveState();renderQuizQuestion();renderShell();break;
    case 'quiz-back':if(app.quizIndex>1){app.quizIndex--;renderQuizQuestion();}else{app.quizIndex=0;renderQuizQuestion();}break;
    case 'quiz-next':if(app.quizAnswers[QUESTIONS[app.quizIndex-1].key]){app.quizIndex++;renderQuizQuestion();}break;
    case 'quiz-submit':if(app.quizAnswers[QUESTIONS[app.quizIndex-1].key]){app.quiz=computeQuiz();app.plan=buildPlan(app.quiz,app.photoScores);app.planLang=app.lang;saveState();renderShell();renderHomeQuiz();showToast(t('created'));}break;
    case 'make-plan':makePlan();break;
    case 'photo-quiz-combine':if(app.quiz)makePlan();else openView('quiz');break;
    case 'chat-question':showToast(t('chatUnavailable'));break;
    case 'close-dialog':$('#dialogHost').innerHTML='';break;
    case 'plan-language':app.planLang=app.planLang==='hi'?'en':'hi';app.lang=app.planLang;renderShell();renderPlan();break;
    case 'plan-print':window.print();break;
    case 'plan-copy':try{await navigator.clipboard.writeText(planText());showToast(t('copied'));}catch(error){const area=document.createElement('textarea');area.value=planText();area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();if(ok)showToast(t('copied'));else showToast(app.lang==='hi'?'कॉपी नहीं हो सकी।':'Copy failed.');}break;
    case 'plan-whatsapp':window.open(`https://wa.me/?text=${encodeURIComponent(planText())}`,'_blank','noopener,noreferrer');break;
  }
});
$('#languageToggle').addEventListener('click',()=>{app.lang=app.lang==='hi'?'en':'hi';app.planLang=app.lang;saveState();renderShell();renderView(app.view);});
$('#globalSearch').addEventListener('input',e=>{app.search=e.target.value;if(app.view!=='remedies')openView('remedies');else renderRemedies();const input=$('#remedySearch');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}});
document.addEventListener('input',e=>{if(e.target.id==='remedySearch'){app.search=e.target.value;const pos=e.target.selectionStart;renderRemedies();const input=$('#remedySearch');input.focus();input.setSelectionRange(pos,pos);$('#globalSearch').value=app.search;}});
document.addEventListener('change',e=>{
  if(e.target.id==='photoFile'){const file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){showToast(app.lang==='hi'?'कृपया तस्वीर वाली फ़ाइल चुनें।':'Please choose an image file.');return;}if(app.photo&&app.photo.url)URL.revokeObjectURL(app.photo.url);app.photo={name:file.name,url:URL.createObjectURL(file)};app.photoScores=null;renderPhoto();return;}
  if(e.target.id==='analyzePhoto')analyzeImage();
  if(e.target.matches('[data-routine]')){app.routineTicks[e.target.dataset.routine]=e.target.checked;saveState();renderRoutine();}
});
document.addEventListener('click',e=>{if(e.target.id==='analyzePhoto')analyzeImage();});
$('#menuToggle').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#drawerShade').classList.toggle('show',open);$('#menuToggle').setAttribute('aria-expanded',String(open));});
$('#drawerShade').addEventListener('click',closeDrawer);
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installApp').hidden=false;});
window.addEventListener('appinstalled',()=>{$('#installApp').hidden=true;installPrompt=null;showToast(app.lang==='hi'?'HerbalGhar इंस्टॉल हो गया।':'HerbalGhar is installed.');});
$('#installApp').addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;}else showToast(app.lang==='hi'?'ब्राउज़र मेनू में “इंस्टॉल करें” या “होम स्क्रीन पर जोड़ें” चुनें।':'Choose “Install” or “Add to Home Screen” from your browser menu.');});
if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('#installApp').hidden=true;
loadSaved();if(app.quiz)app.plan=buildPlan(app.quiz,app.photoScores);renderShell();renderView('quiz');
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js').catch(error=>console.warn('HerbalGhar: service worker register nahi hua.',error));
</script>
