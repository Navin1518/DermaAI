name: Deploy DermaCare AI frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Enable GitHub Pages if needed
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getPages({ owner, repo });
              core.info("GitHub Pages is already enabled.");
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: "workflow"
              });
              core.info("Enabled GitHub Pages with GitHub Actions.");
            }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage the frontend files
        run: |
          mkdir -p "$RUNNER_TEMP/dermacare-pages"
          cp -R index.html assets app-logo.png apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest service-worker.js "$RUNNER_TEMP/dermacare-pages/"

      - name: Package the frontend files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/dermacare-pages

      - name: Publish the frontend
        id: deployment
        uses: actions/deploy-pages@v4
